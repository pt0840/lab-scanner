<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>สแกน QR · Stock วัสดุ</title>
<!--
  Live QR scanner for the "ระบบจัดการ Stock วัสดุ" Apps Script app.
  Why this page exists: the Apps Script web app runs inside a Google iframe
  where many phone browsers block live camera access. This page runs
  top-level on GitHub Pages (HTTPS), so the live camera always works.

  Flow:  app  →  stock.html?app=<APP /exec URL>&t=IN|OUT&ss=<substock>
         scan →  <APP URL>?code=<material code>&t=..&ss=..   (back to the app)

  Opening this page directly (bookmark / home-screen icon) also works:
  it remembers the last app URL it was opened from, or uses DEFAULT_APP_URL.
  Nothing is uploaded — frames are decoded on the phone only.
-->
<style>
  /* Same look as the equipment scanner (สแกน QR เครื่องมือ); accent = stock app pink */
  :root { --accent: #f51b70; --accent-dark: #db0862; --muted: #a1a1aa; --corner: #8e8e93; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: 'Sarabun', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100dvh; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.28); pointer-events: none; }

  /* Top bar: round close button + title, left aligned */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px; }
  .close { width: 52px; height: 52px; border-radius: 50%; background: rgba(28,28,30,.85); border: none;
    display: inline-flex; align-items: center; justify-content: center; color: #d4d4d8; text-decoration: none; flex-shrink: 0; }
  .close svg { width: 22px; height: 22px; }
  .top h1 { margin: 0; font-size: 19px; font-weight: 700; color: #d4d4d8; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  /* Scan area: four corner brackets + sweeping line */
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 90px 20px calc(30px + env(safe-area-inset-bottom)); pointer-events: none; z-index: 2; }
  .frame { position: relative; width: min(72vw, 300px); aspect-ratio: 1; }
  .frame i { position: absolute; width: 22%; height: 22%; border: 3px solid var(--corner); transition: border-color .2s; }
  .frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 22px; }
  .frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 22px; }
  .frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 22px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 22px; }
  .frame b { position: absolute; left: 10%; right: 10%; height: 2px; top: 14%; border-radius: 2px;
    background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: sweep 2s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { top: 14%; } 50% { top: 86%; } }
  .frame.live i { border-color: #fff; }
  .frame.found i { border-color: #4ade80; }
  .frame.found b { animation: none; opacity: 0; }

  .msg { max-width: 330px; text-align: center; font-size: 15px; color: var(--muted); line-height: 1.55;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); min-height: 1.5em; }
  .msg.ok { color: #86efac; } .msg.err { color: #fca5a5; }

  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 26px;
    border-radius: 30px; border: 1.5px solid #52525b; background: rgba(0,0,0,.35); color: #d4d4d8;
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .pill svg { width: 22px; height: 22px; }
  .pill.primary { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .pill:active { transform: scale(.97); }
  .link { background: none; border: none; color: #71717a; font: inherit; font-size: 14px; padding: 6px 10px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* Bottom sheets: type a code / set the app link */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; flex-direction: column; gap: 10px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: #1c1c1e; border-radius: 22px 22px 0 0; }
  .sheet.show { display: flex; }
  .sheet .row { display: flex; gap: 8px; }
  .sheet input { flex: 1; min-width: 0; min-height: 48px; border-radius: 14px; border: 1px solid #3f3f46; background: #0f0f10;
    color: #fff; padding: 0 14px; font: inherit; font-size: 16px; }
  .sheet .pill { min-height: 48px; padding: 10px 20px; }
  .sheet p { margin: 0; font-size: 14px; line-height: 1.5; color: #d4d4d8; }
  .diag { font-size: 11.5px; color: #71717a; word-break: break-all; text-align: center; max-width: 340px; }

  /* Shown before the camera starts / when it can't start */
  .start { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 100px 28px 40px; text-align: center; background: #000; }
  .start p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 340px; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="shade"></div>

<div class="top">
  <a class="close" id="backLink" href="#" aria-label="ปิด">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
  <h1>สแกน QR วัสดุ</h1>
</div>

<div class="center">
  <div class="frame" id="frame"><i></i><i></i><i></i><i></i><b></b></div>
  <div class="msg" id="msg">กำลังเปิดกล้อง…</div>
  <div class="actions">
    <button class="pill" id="photoBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      ถ่ายภาพแทน
    </button>
    <button class="link" id="manualBtn" type="button">พิมพ์รหัสแทน</button>
  </div>
</div>

<div class="start" id="startPanel" style="display:none;">
  <p id="startText">แตะ "เริ่มสแกน" แล้วอนุญาตให้ใช้กล้อง<br>ไม่มีการบันทึกหรือส่งภาพออกจากโทรศัพท์</p>
  <button class="pill primary" id="startBtn" type="button">เริ่มสแกน</button>
  <button class="pill" id="copyBtn" type="button" style="display:none;">คัดลอกลิงก์ไปเปิดใน Safari / Chrome</button>
  <div class="diag" id="diag"></div>
</div>

<div class="sheet" id="manual">
  <p>พิมพ์รหัสวัสดุ</p>
  <div class="row">
    <input id="manualCode" type="text" placeholder="เช่น 10005902-1" autocomplete="off">
    <button class="pill primary" id="manualGo" type="button">ตกลง</button>
  </div>
</div>
<div class="sheet" id="appSetup">
  <p>ตั้งลิงก์แอปครั้งแรก: เปิดแอปใน Safari/Chrome แล้วคัดลอกลิงก์จากช่องที่อยู่ (ลงท้ายด้วย <b>/exec</b>) มาวางที่นี่ — ระบบจะจำไว้ในเครื่องนี้</p>
  <div class="row">
    <input id="appUrlInput" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <button class="pill primary" id="appUrlSave" type="button">บันทึก</button>
  </div>
  <div class="diag" id="diag2"></div>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>window.jsQR || document.write('<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"><\/script>');</script>
<script>
(function () {
  // Optional: put your Apps Script /exec URL here so the page also works when
  // opened directly before it has ever been opened from the app.
  var DEFAULT_APP_URL = 'https://script.google.com/macros/s/AKfycbz2yHbfUdpSgo0iW30sAhB22MshfEwja916TtQooon6yKa3b_CjUNmMFR1AyiiSi2mY/exec';

  // Only ever send people back to a Google Apps Script web app (no open redirect).
  var APP_RE = /^https:\/\/script\.google\.com\/(?:[^?#]*\/)?macros\/(?:[^\/?#]+\/)?s\/[\w-]+\/(?:exec|dev)$/;
  var STORE_KEY = 'stockScannerAppUrl';
  var params = new URLSearchParams(location.search);

  // Normalise: drop any ?query/#hash and trailing slash someone may paste along
  function cleanApp(u) { return typeof u === 'string' ? u.trim().split(/[?#]/)[0].replace(/\/+$/, '') : u; }
  function validApp(u) { return typeof u === 'string' && APP_RE.test(u); }
  var rawAppParam = params.get('app');
  var appUrl = cleanApp(rawAppParam);
  try {
    if (validApp(appUrl)) localStorage.setItem(STORE_KEY, appUrl);
    else appUrl = localStorage.getItem(STORE_KEY) || DEFAULT_APP_URL;
  } catch (e) { if (!validApp(appUrl)) appUrl = DEFAULT_APP_URL; }
  if (!validApp(appUrl)) appUrl = '';

  // Extra values handed through the round trip (entry type, sub-stock)
  var passThrough = {};
  ['t', 'ss'].forEach(function (k) { var v = params.get(k); if (v) passThrough[k] = v.slice(0, 40); });

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), msg = $('msg');
  var backLink = $('backLink');
  if (appUrl) backLink.href = appUrl;
  backLink.addEventListener('click', function (e) {
    var op = null; try { op = window.opener; } catch (x) {}
    if (op && !op.closed) { e.preventDefault(); stop(); try { op.focus(); } catch (x) {} window.close(); return; }
    if (!appUrl) { e.preventDefault(); stop(); if (history.length > 1) history.back(); }
  });

  function setMsg(text, isErr) { msg.textContent = text; msg.className = 'msg' + (isErr ? ' err' : (/^อ่านได้/.test(text) ? ' ok' : '')); }

  // ---- Environment checks (shown on screen to make problems easy to report) ----
  var ua = navigator.userAgent || '';
  var inApp = /Line\//i.test(ua) ? 'LINE'
    : /FBAN|FBAV|FB_IAB|Messenger/i.test(ua) ? 'Facebook/Messenger'
    : /Instagram/i.test(ua) ? 'Instagram'
    : /MicroMessenger/i.test(ua) ? 'WeChat'
    : /TikTok|musical_ly|Bytedance/i.test(ua) ? 'TikTok' : '';
  var lastError = '';
  function diag() {
    $('diag').textContent = $('diag2').textContent = [
      inApp ? 'เปิดอยู่ในแอป ' + inApp : '',
      'app=' + (appUrl ? 'ok' : (rawAppParam ? 'rejected(' + rawAppParam.slice(0, 60) + ')' : 'none')),
      'secure=' + (window.isSecureContext ? 'yes' : 'no'),
      'camera API=' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no'),
      'decoder=' + ('BarcodeDetector' in window ? 'native' : (window.jsQR ? 'jsQR' : 'none')),
      lastError ? 'error=' + lastError : ''
    ].filter(Boolean).join(' · ');
  }
  // LINE supports reopening a link in the phone's default browser via this flag.
  if (inApp === 'LINE' && params.get('openExternalBrowser') !== '1') {
    params.set('openExternalBrowser', '1');
    location.replace(location.pathname + '?' + params.toString());
    return;
  }
  function offerCopyLink() {
    var btn = $('copyBtn');
    btn.style.display = 'inline-flex';
    btn.onclick = function () {
      var url = location.href;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
        .then(function () { btn.textContent = 'คัดลอกแล้ว — วางในช่องที่อยู่ของ Safari / Chrome'; })
        .catch(function () { window.prompt('คัดลอกลิงก์นี้ไปเปิดใน Safari / Chrome', url); });
    };
  }

  // New labels hold a full app link (…/exec?code=XXX); old labels hold just the code.
  function extractCode(raw) {
    var s = String(raw || '').trim();
    var m = s.match(/[?&]code=([^&#]+)/);
    if (m) { try { return decodeURIComponent(m[1].replace(/\+/g, ' ')).trim(); } catch (e) { return m[1].trim(); } }
    return s;
  }

  var done = false, pendingCode = null;
  function finish(raw) {
    if (done) return;
    var code = extractCode(raw);
    if (!code) return;
    done = true;
    stop();
    $('frame').classList.add('found');
    if (navigator.vibrate) navigator.vibrate(80);
    // Opened as a tab from the app: hand the code back and close — the app
    // stays as it was (no reload, no login).
    if (sendToOpener(code)) return;
    if (!appUrl) {
      pendingCode = code;
      setMsg('อ่านได้: ' + code + ' — ยังไม่รู้ลิงก์ของแอป กรุณาวางลิงก์แอปด้านล่างครั้งเดียว แล้วกด "บันทึก"', true);
      $('appSetup').classList.add('show');
      diag();
      done = false;
      return;
    }
    var q = new URLSearchParams(Object.assign({ code: code }, passThrough));
    setMsg('อ่านได้: ' + code + ' — กำลังกลับไปที่แอป…');
    location.replace(appUrl + '?' + q.toString());
  }

  var ackReceived = false;
  window.addEventListener('message', function (ev) {
    if (ev.data && ev.data.type === 'stock-scan-ack') ackReceived = true;
  });
  function sendToOpener(code) {
    var op = null;
    try { op = window.opener; } catch (e) { op = null; }
    if (!op || op.closed) return false;
    try { op.postMessage({ type: 'stock-scan', code: code }, '*'); } catch (e) { return false; }
    setMsg('อ่านได้: ' + code + ' — ส่งกลับไปที่แอปแล้ว');
    setTimeout(function () {
      if (!ackReceived) { // app tab didn't answer (e.g. it was reloaded) → fall back to reopening the app
        if (appUrl) {
          var q = new URLSearchParams(Object.assign({ code: code }, passThrough));
          location.replace(appUrl + '?' + q.toString());
        } else { done = false; }
        return;
      }
      window.close();
      // Some browsers refuse to close the tab: tell the user to switch back
      setTimeout(function () {
        setMsg('อ่านได้: ' + code + ' — ส่งเข้าแอปแล้ว ปิดแท็บนี้แล้วกลับไปที่แท็บของแอปได้เลย');
        // the X button already switches back to the app tab
      }, 400);
    }, 700);
    return true;
  }

  // ---- Live camera ----
  var stream = null, raf = null, detector = null, busy = false, last = 0, pass = 0;
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });

  function stop() {
    $('frame').classList.remove('live');
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }

  async function start() {
    $('startPanel').style.display = 'none';
    $('frame').classList.remove('found');
    setMsg('กำลังเปิดกล้อง…');
    if (inApp) {
      showStart('หน้านี้เปิดอยู่ในแอป ' + inApp + ' ซึ่งไม่อนุญาตให้ใช้กล้องแบบสด — กรุณาเปิดใน Safari หรือ Chrome (แตะ ⋯ แล้วเลือก "เปิดในเบราว์เซอร์") หรือใช้ "ถ่ายภาพแทน"');
      offerCopyLink();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStart('เบราว์เซอร์นี้เปิดกล้องแบบสดไม่ได้ กรุณาเปิดใน Safari หรือ Chrome หรือใช้ "ถ่ายภาพแทน"');
      offerCopyLink();
      return;
    }
    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
      } catch (e1) {
        if (e1 && (e1.name === 'NotAllowedError' || e1.name === 'SecurityError')) throw e1;
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); // simplest request
      }
      video.srcObject = stream;
      await video.play();
      if (!detector && 'BarcodeDetector' in window) {
        try {
          var f = await BarcodeDetector.getSupportedFormats();
          if (f.indexOf('qr_code') > -1) detector = new BarcodeDetector({ formats: ['qr_code'] });
        } catch (e) { detector = null; }
      }
      if (!detector && !window.jsQR) {
        lastError = 'no QR decoder loaded';
        setMsg('โหลดตัวอ่าน QR ไม่สำเร็จ (อินเทอร์เน็ต?) กรุณารีเฟรชหน้า หรือใช้ "พิมพ์รหัส"', true);
      } else {
        setMsg('เล็ง QR Code ให้อยู่ในกรอบ ระบบจะอ่านอัตโนมัติ');
        $('frame').classList.add('live');
      }
      raf = requestAnimationFrame(tick);
    } catch (err) {
      stop();
      lastError = (err && (err.name + (err.message ? ': ' + err.message : ''))) || String(err);
      var name = err && err.name;
      showStart(
        name === 'NotAllowedError' || name === 'SecurityError'
          ? 'ไม่ได้รับอนุญาตให้ใช้กล้อง — iPhone: ตั้งค่า › Safari › กล้อง › อนุญาต / Android: แตะไอคอนแม่กุญแจข้างลิงก์ › สิทธิ์ › กล้อง › อนุญาต แล้วกด "ลองอีกครั้ง"'
        : name === 'NotReadableError' || name === 'AbortError'
          ? 'กล้องถูกใช้งานโดยแอปอื่นอยู่ — ปิดแอปกล้อง/แท็บอื่นที่ใช้กล้อง แล้วกด "ลองอีกครั้ง"'
        : name === 'NotFoundError' || name === 'OverconstrainedError'
          ? 'ไม่พบกล้องหลังที่ใช้ได้ กด "ลองอีกครั้ง" หรือใช้ "ถ่ายภาพแทน"'
          : 'เปิดกล้องไม่สำเร็จ กรุณากด "ลองอีกครั้ง" หรือใช้ "ถ่ายภาพแทน"');
    }
  }
  function showStart(text) {
    diag();
    $('startText').textContent = text;
    $('startBtn').textContent = 'ลองอีกครั้ง';
    $('startPanel').style.display = 'flex';
  }

  async function tick(ts) {
    if (!stream) return;
    raf = requestAnimationFrame(tick);
    if (busy || ts - last < 120) return;
    last = ts;
    if (video.readyState < 2 || !video.videoWidth) return;
    busy = true;
    try {
      var code = null;
      if (detector) {
        try {
          var found = await detector.detect(video);
          if (found && found.length) code = found[0].rawValue;
        } catch (de) { if (window.jsQR) detector = null; }
      } else if (window.jsQR) {
        // Alternate between a centre crop (fast, ignores clutter) and the whole frame
        pass++;
        var vw = video.videoWidth, vh = video.videoHeight, sw, sh, sx, sy;
        if (pass % 2) { sw = sh = Math.min(vw, vh) * 0.8; sx = (vw - sw) / 2; sy = (vh - sh) / 2; }
        else { sw = vw; sh = vh; sx = 0; sy = 0; }
        var scale = Math.min(1, 640 / Math.max(sw, sh));
        var w = Math.round(sw * scale), h = Math.round(sh * scale);
        canvas.width = w; canvas.height = h;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
        var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: pass % 4 === 0 ? 'attemptBoth' : 'dontInvert' });
        if (r && r.data) code = r.data;
      }
      if (code) finish(code);
    } catch (e) { /* skip frame */ }
    busy = false;
  }

  // ---- Photo fallback ----
  function decodeFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var max = 1000, w = img.width, h = img.height;
        if (w > max || h > max) { if (w >= h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        var r = window.jsQR ? jsQR(ctx.getImageData(0, 0, w, h).data, w, h) : null;
        if (r && r.data) finish(r.data);
        else setMsg('ไม่พบ QR Code ในภาพ กรุณาถ่ายใหม่ให้ QR อยู่กลางภาพและชัด', true);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('appUrlSave').addEventListener('click', function () {
    var u = cleanApp($('appUrlInput').value);
    if (!validApp(u)) { setMsg('ลิงก์ไม่ถูกต้อง — ต้องเป็นลิงก์ script.google.com ที่ลงท้ายด้วย /exec', true); return; }
    appUrl = u;
    try { localStorage.setItem(STORE_KEY, u); } catch (e) {}
    backLink.href = u;
    $('appSetup').classList.remove('show');
    if (pendingCode) finish(pendingCode); else setMsg('บันทึกลิงก์แอปแล้ว');
  });
  $('startBtn').addEventListener('click', start);
  $('photoBtn').addEventListener('click', function () { $('photoInput').click(); });
  $('photoInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) { stop(); decodeFile(f); }
  });
  $('manualBtn').addEventListener('click', function () {
    $('manual').classList.toggle('show');
    if ($('manual').classList.contains('show')) $('manualCode').focus();
  });
  $('manualGo').addEventListener('click', function () { finish($('manualCode').value); });
  $('manualCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') finish($('manualCode').value); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!done && $('startPanel').style.display === 'none' && !stream) start();
  });

  // Start right away when opened from the app (a tap just happened there);
  // otherwise wait for the "เริ่มสแกน" tap.
  diag();
  if (params.get('app') || params.get('t')) start(); // opened from the app's scan button
  else $('startPanel').style.display = 'flex';        // opened directly: wait for a tap
})();
</script>
</body>
</html>
